<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Electricity vs Diesel</title><style>*{box-sizing:border-box}body{margin:0;background:#111214;color:#f5f5f7;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;padding:24px}.app{max-width:720px;margin:auto}h1{font-size:30px;margin:4px 0 6px}.sub{color:#9b9ca1;margin:0 0 22px}.card{background:#1d1e22;border:1px solid #303136;border-radius:20px;padding:20px;margin-bottom:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:block;color:#a2a3a8;font-size:13px;margin-bottom:7px}input{width:100%;background:#111214;border:1px solid #38393e;color:#fff;border-radius:12px;padding:13px;font-size:17px}.compare{display:grid;grid-template-columns:1fr 55px 1fr;gap:12px;align-items:center;margin-bottom:14px}.side{text-align:center;background:#151619;border:1px solid #303136;border-radius:18px;padding:22px 10px}.side.winner{border-color:#e82127;box-shadow:0 0 0 1px #e82127}.name{font-size:14px;color:#a2a3a8}.big{font-size:31px;font-weight:800;margin:8px 0 2px}.unit{font-size:13px;color:#8e9095}.vs{text-align:center;color:#777;font-weight:800}.row{display:flex;justify-content:space-between;gap:20px;padding:13px 0;border-bottom:1px solid #303136}.row:last-child{border-bottom:0}.muted{color:#a2a3a8}.winner{text-align:center}.winner-title{font-size:25px;font-weight:800;margin-top:5px}.winner-sub{color:#a2a3a8;margin-top:5px}@media(max-width:560px){body{padding:16px}.grid{grid-template-columns:1fr}.compare{grid-template-columns:1fr}.vs{display:none}}</style></head><body><main class="app"><div class="sub">RUNNING COST</div><h1>Electricity vs Diesel</h1><p class="sub">Which energy source is cheaper for your driving?</p><section class="card"><div class="grid"><div><label>Annual kilometres</label><input id="km" type="number" value="30000" min="0"></div><div><label>EV consumption (kWh/100 km)</label><input id="evcons" type="number" value="18.9" min="0" step="0.1"></div><div><label>Electricity price (€/kWh)</label><input id="elec" type="number" value="0.35" min="0" step="0.01"></div><div><label>Diesel consumption (L/100 km)</label><input id="diescons" type="number" value="4.7" min="0" step="0.1"></div><div><label>Diesel price (€/L)</label><input id="diesel" type="number" value="2.50" min="0" step="0.01"></div></div></section><div class="compare"><div id="evBox" class="side"><div class="name">⚡ ELECTRICITY</div><div id="ev100" class="big">€0.00</div><div class="unit">per 100 km</div></div><div class="vs">VS</div><div id="diesBox" class="side"><div class="name">⛽ DIESEL</div><div id="dies100" class="big">€0.00</div><div class="unit">per 100 km</div></div></div><section class="card"><div class="row"><span class="muted">Electricity cost / year</span><strong id="evYear">€0.00</strong></div><div class="row"><span class="muted">Diesel cost / year</span><strong id="diesYear">€0.00</strong></div><div class="row"><span class="muted">Saving per 100 km</span><strong id="save100">€0.00</strong></div><div class="row"><span class="muted">Annual saving</span><strong id="saveYear">€0.00</strong></div></section><section class="card winner"><div class="muted">WINNER</div><div id="winner" class="winner-title">—</div><div id="winnerSub" class="winner-sub"></div></section></main><script>const ids=["km","evcons","elec","diescons","diesel"],$=id=>document.getElementById(id),num=id=>Math.max(0,Number($(id).value)||0),money=x=>"€"+x.toLocaleString("fi-FI",{minimumFractionDigits:2,maximumFractionDigits:2});function calculate(){const km=num("km"),e=num("evcons")*num("elec"),d=num("diescons")*num("diesel"),ey=km/100*e,dy=km/100*d,yd=dy-ey;$("ev100").textContent=money(e);$("dies100").textContent=money(d);$("evYear").textContent=money(ey);$("diesYear").textContent=money(dy);$("save100").textContent=money(Math.abs(d-e));$("saveYear").textContent=money(Math.abs(yd));$("evBox").classList.toggle("winner",ey<dy);$("diesBox").classList.toggle("winner",dy<ey);if(ey<dy){$("winner").textContent="⚡ ELECTRICITY WINS";$("winnerSub").textContent=money(yd)+" saved per year"}else if(dy<ey){$("winner").textContent="⛽ DIESEL WINS";$("winnerSub").textContent=money(-yd)+" saved per year"}else{$("winner").textContent="DRAW";$("winnerSub").textContent="Same energy cost"}}ids.forEach(id=>$(id).addEventListener("input",calculate));calculate();</script></body></html>
